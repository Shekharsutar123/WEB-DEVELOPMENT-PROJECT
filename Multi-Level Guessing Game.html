<!DOCTYPE html>
<html>
<head>
<title>Multi-Level Guessing Game</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#667eea,#764ba2);
}

.container{
    width:380px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(15px);
    padding:30px;
    border-radius:20px;
    box-shadow:0 15px 35px rgba(0,0,0,0.3);
    text-align:center;
    color:white;
}

h2{
    margin-bottom:20px;
}

select, input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:10px;
    font-size:16px;
    outline:none;
}

.buttons{
    margin-top:10px;
}

button{
    padding:10px 15px;
    margin:5px;
    border:none;
    border-radius:10px;
    font-size:14px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
}

.start{ background:#00c853; color:white; }
.check{ background:#2196f3; color:white; }
.reset{ background:#ff5252; color:white; }

.info{
    margin-top:15px;
    font-size:16px;
}

</style>
</head>

<body>

<div class="container">

<h2>🎯 Guessing Game</h2>

<select id="level">
<option value="1">Easy (1-50)</option>
<option value="2">Medium (1-100)</option>
<option value="3">Hard (1-200)</option>
</select>

<input type="number" id="guess" placeholder="Enter your guess">

<div class="buttons">
<button class="start" onclick="startGame()">Start</button>
<button class="check" onclick="check()">Check</button>
<button class="reset" onclick="restart()">Replay</button>
</div>

<div class="info">
<p id="msg"></p>
<p id="attempts"></p>
<p id="score"></p>
</div>

</div>

<script>

let number = 0;
let attempts = 0;
let maxAttempts = 0;
let score = 0;

function startGame(){
    let level = document.getElementById("level").value;

    if(level == "1"){
        number = Math.floor(Math.random()*50)+1;
        maxAttempts = 10;
    }
    else if(level == "2"){
        number = Math.floor(Math.random()*100)+1;
        maxAttempts = 7;
    }
    else{
        number = Math.floor(Math.random()*200)+1;
        maxAttempts = 5;
    }

    attempts = 0;
    document.getElementById("msg").innerHTML="Game Started!";
    document.getElementById("attempts").innerHTML="";
    document.getElementById("score").innerHTML="Score: " + score;
}

function check(){

    let guess = Number(document.getElementById("guess").value);

    if(number == 0){
        alert("Click Start first!");
        return;
    }

    attempts++;

    if(guess == number){
        score += 10;
        document.getElementById("msg").innerHTML="🎉 Correct!";
        document.getElementById("score").innerHTML="Score: " + score;
        number = 0;
    }
    else if(attempts >= maxAttempts){
        document.getElementById("msg").innerHTML="❌ Game Over! Number was " + number;
        number = 0;
    }
    else if(guess > number){
        document.getElementById("msg").innerHTML="⬆ Too High!";
    }
    else{
        document.getElementById("msg").innerHTML="⬇ Too Low!";
    }

    document.getElementById("attempts").innerHTML="Attempts: " + attempts + "/" + maxAttempts;
}

function restart(){
    number = 0;
    attempts = 0;
    document.getElementById("msg").innerHTML="Game Reset!";
    document.getElementById("attempts").innerHTML="";
    document.getElementById("guess").value="";
}

</script>

</body>
</html>
